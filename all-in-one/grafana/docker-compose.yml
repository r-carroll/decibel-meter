version: '3'
services:
  grafana:
    image: grafana/grafana-oss
    user: grafana:grafana_group
    container_name: grafana
    restart: unless-stopped
    environment:
    - GF_SERVER_HTTP_ADDR=
    - GF_SERVER_HTTP_PORT=3000
    ports:
      - '3000:3000'
    volumes:
      - grafana-storage:/var/lib/grafana
volumes:
  grafana-storage: {}
